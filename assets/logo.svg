    <!-- fins (behind body) -->
    <path d="M214 296 Q168 318 158 378 Q160 402 182 398 L214 386 Z" fill="#00ADD8" stroke="#1E2A3A" stroke-width="14"/>
    <path d="M346 296 Q392 318 402 378 Q400 402 378 398 L346 386 Z" fill="#00ADD8" stroke="#1E2A3A" stroke-width="14"/>

    <!-- body: white knockout, then body -->
    <path d="M280 66 Q340 118 350 220 L352 362 Q352 394 320 396 L240 396 Q208 394 208 362 L210 220 Q220 118 280 66 Z"
          fill="none" stroke="#FFFFFF" stroke-width="36"/>
    <path d="M280 66 Q340 118 350 220 L352 362 Q352 394 320 396 L240 396 Q208 394 208 362 L210 220 Q220 118 280 66 Z"
