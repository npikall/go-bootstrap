    <path d="M254 190 Q280 186 306 190 Q324 192 324 210 L324 218 Q280 222 236 218 L236 210 Q236 192 254 190 Z"
          fill="#FFC94D" stroke="#1E2A3A" stroke-width="14"/>
    <path d="M258 238 L278 252 L258 266" fill="none" stroke="#1E2A3A" stroke-width="12"/>
    <path d="M290 266 L306 266" fill="none" stroke="#00ADD8" stroke-width="12"/>

    <!-- smoke puffs -->
    <circle cx="214" cy="468" r="24" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="12"/>
    <circle cx="348" cy="470" r="20" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="12"/>
    <circle cx="170" cy="488" r="12" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="12"/>
    <circle cx="390" cy="490" r="10" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="12"/>
