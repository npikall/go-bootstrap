<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="go-bootstrap logo: a rocket with a browser-window porthole">
  <!-- palette: ink #1E2A3A · white #FFFFFF · go-cyan #00ADD8 · sun #FFC94D -->
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- speed lines -->
    <g fill="none" stroke="#1E2A3A" stroke-width="14">
      <path d="M140 170 Q138 200 140 230"/>
      <path d="M112 250 Q110 268 112 286"/>
      <path d="M420 160 Q422 200 420 240"/>
      <path d="M448 262 Q450 280 448 298"/>
