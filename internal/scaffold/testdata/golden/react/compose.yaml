services:
  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    ports:
      - ${PORT}:${PORT}
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - 5173:5173
    depends_on:
      - app
  db:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - ${DB_PORT}:27017
    volumes:
      - db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db:
