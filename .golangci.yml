version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G301 # generated projects need world-readable directories
        - G306 # generated projects need world-readable files
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/npikall/go-bootstrap
